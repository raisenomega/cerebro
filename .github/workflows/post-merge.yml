name: Post-Merge Sentinel

# "POST-PUSH" tras el merge a develop. Hace DOS cosas:
#   1. Re-corre el Sentinel sobre develop ya integrado (por si dos cambios
#      que pasaron por separado se rompen al juntarse).
#   2. Notificación al auditor: destino EN BLANCO — enchufar el webhook/secreto.
#
# La bitácora auto-commiteada a develop se RETIRÓ (Slice 1): el bot empujaba a
# una rama protegida, lo que choca con la branch protection. El historial de
# merges queda en el git log y en la página de PRs.
#
# Nota de grado bancario: NO despliega nada. El deploy lleva firma humana
# (Constitución §3). Si algún día se agrega deploy aquí, va detrás de un
# environment con "required reviewers", nunca automático.

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # --- 1) Re-corrida del Sentinel sobre develop integrado ---
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Make sentinel scripts executable
        run: chmod +x scripts/sentinel.sh scripts/sentinel/*.sh
      - name: Re-run sentinel on integrated develop
        run: bash scripts/sentinel.sh

  # --- 2) Notificación al auditor (DESTINO EN BLANCO) ---
  notify-auditor:
    runs-on: ubuntu-latest
    steps:
      - name: Notify (placeholder — enchufar webhook)
        run: |
          echo "═══════════════════════════════════════════════"
          echo " MERGE A DEVELOP — aviso al auditor"
          echo "   repo:   ${GITHUB_REPOSITORY}"
          echo "   commit: ${GITHUB_SHA::7}"
          echo "   actor:  ${GITHUB_ACTOR}"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "TODO(owner): enchufar el canal de notificación."
          echo "  - Crear un secret del repo (ej. AUDITOR_WEBHOOK_URL)."
          echo "  - Descomentar el paso 'Send webhook' de abajo."
          echo "  - Hoy esto solo imprime en el log de Actions (no sale a ningún lado)."

      # Descomentar y configurar el secret AUDITOR_WEBHOOK_URL para activar:
      # - name: Send webhook
      #   env:
      #     WEBHOOK: ${{ secrets.AUDITOR_WEBHOOK_URL }}
      #   run: |
      #     [ -z "$WEBHOOK" ] && { echo "sin webhook configurado"; exit 0; }
      #     curl -sS -X POST "$WEBHOOK" \
      #       -H 'Content-Type: application/json' \
      #       -d "{\"text\":\"Merge a develop en ${GITHUB_REPOSITORY} · ${GITHUB_SHA::7} · por ${GITHUB_ACTOR}\"}"
